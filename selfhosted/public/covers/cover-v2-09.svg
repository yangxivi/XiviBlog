<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FBBF24"/>
      <stop offset="1" stop-color="#B45309"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.72" cy="0.24" r="0.7">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="v" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0.30" stop-color="#000" stop-opacity="0"/>
      <stop offset="0.70" stop-color="#000" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.52"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#g)"/>
  <rect width="1200" height="675" fill="url(#glow)"/>

  <!-- 细网格 -->
  <g stroke="#fff" stroke-opacity="0.07" stroke-width="1.5">
    <path d="M0 0 V675"/><path d="M100 0 V675"/><path d="M200 0 V675"/><path d="M300 0 V675"/><path d="M400 0 V675"/><path d="M500 0 V675"/><path d="M600 0 V675"/><path d="M700 0 V675"/><path d="M800 0 V675"/><path d="M900 0 V675"/><path d="M1000 0 V675"/>
    <path d="M0 0 H1200"/><path d="M0 100 H1200"/><path d="M0 200 H1200"/><path d="M0 300 H1200"/><path d="M0 400 H1200"/><path d="M0 500 H1200"/><path d="M0 600 H1200"/>
  </g>

  <!-- 大圆与圆环 -->
  <circle cx="1010" cy="140" r="330" fill="#fff" opacity="0.12"/>
  <circle cx="980" cy="165" r="390" fill="none" stroke="#fff" stroke-opacity="0.16" stroke-width="2"/>
  <circle cx="250" cy="465" r="150" fill="#fff" opacity="0.09"/>

  <!-- 斜线组 -->
  <g stroke="#fff" stroke-opacity="0.14" stroke-width="2.5">
    <path d="M740 675 L1000 405 M830 675 L1090 405 M920 675 L1180 405"/>
  </g>

  <!-- 波浪带 -->
  <path d="M0 490 Q300 330 600 490 T1200 490 V675 H0Z" fill="#000" opacity="0.09"/>

  <!-- 右上小方块阵列 -->
  <g fill="#fff" opacity="0.18">
    <rect x="1010" y="72" width="12" height="12" rx="3"/><rect x="984" y="72" width="12" height="12" rx="3"/><rect x="958" y="72" width="12" height="12" rx="3"/><rect x="932" y="72" width="12" height="12" rx="3"/><rect x="906" y="72" width="12" height="12" rx="3"/><rect x="880" y="72" width="12" height="12" rx="3"/>
    <rect x="1010" y="96" width="12" height="12" rx="3"/><rect x="984" y="96" width="12" height="12" rx="3"/><rect x="958" y="96" width="12" height="12" rx="3"/><rect x="932" y="96" width="12" height="12" rx="3"/>
  </g>

  <!-- 底部压暗，保证叠白字可读 -->
  <rect width="1200" height="675" fill="url(#v)"/>
</svg>
