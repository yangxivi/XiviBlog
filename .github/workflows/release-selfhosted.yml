name: Release Selfhosted

on:
  push:
    branches: [main]
    paths:
      - 'selfhosted/**'
      - '.github/workflows/release-selfhosted.yml'
  workflow_dispatch:

concurrency:
  group: release-selfhosted-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            selfhosted

      - name: Create package
        run: |
          cd selfhosted
          zip -r ../XiviBlog-selfhosted.zip . -x "node_modules/*" -x ".next/*" -x ".git/*"
          cd ..
          echo "Package size: $(du -h XiviBlog-selfhosted.zip | cut -f1)"
          ls -la XiviBlog-selfhosted.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: XiviBlog-selfhosted
          path: XiviBlog-selfhosted.zip
