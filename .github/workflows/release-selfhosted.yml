name: Release Selfhosted

on:
  push:
    branches: [main]
    paths:
      - 'selfhosted/**'
      - '.github/workflows/release-selfhosted.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-selfhosted-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Read version
        id: ver
        run: echo "version=$(grep -oP 'APP_VERSION = "\K[0-9.]+' selfhosted/lib/version.ts)" >> "$GITHUB_OUTPUT"

      - name: Install deps & build
        working-directory: selfhosted
        env:
          NEXT_TELEMETRY_DISABLED: 1
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Package source zip (需服务器构建)
        run: |
          VER=${{ steps.ver.outputs.version }}
          STAGE=$RUNNER_TEMP/src/selfhosted
          mkdir -p "$STAGE"
          rsync -a \
            --exclude node_modules --exclude '.next' --exclude data \
            --exclude '.env*' --exclude '.git' \
            selfhosted/ "$STAGE/"
          (cd "$RUNNER_TEMP/src" && zip -rq "$RUNNER_TEMP/xiviblog-selfhosted-v$VER.zip" selfhosted)
          echo "source zip: $(du -h "$RUNNER_TEMP/xiviblog-selfhosted-v$VER.zip" | cut -f1)"

      - name: Package prebuilt zip (免服务器构建)
        run: |
          VER=${{ steps.ver.outputs.version }}
          STAGE=$RUNNER_TEMP/prebuilt/selfhosted
          mkdir -p "$STAGE"
          rsync -a \
            --exclude node_modules --exclude data \
            --exclude '.env*' --exclude '.git' --exclude '.next/cache' \
            selfhosted/ "$STAGE/"
          (cd "$RUNNER_TEMP/prebuilt" && zip -rq "$RUNNER_TEMP/xiviblog-prebuilt-v$VER.zip" selfhosted)
          echo "prebuilt zip: $(du -h "$RUNNER_TEMP/xiviblog-prebuilt-v$VER.zip" | cut -f1)"

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          VER: ${{ steps.ver.outputs.version }}
        run: |
          TAG="v$VER"
          gh release view "$TAG" --repo yangxivi/XiviBlog > /dev/null 2>&1 \
            && gh release upload "$TAG" --repo yangxivi/XiviBlog --clobber \
                 "$RUNNER_TEMP/xiviblog-selfhosted-v$VER.zip" \
                 "$RUNNER_TEMP/xiviblog-prebuilt-v$VER.zip" \
            || gh release create "$TAG" --repo yangxivi/XiviBlog --latest \
                 --title "v$VER" \
                 --notes "自动构建发布。

          - **xiviblog-prebuilt-v$VER.zip**：源码 + CI 预构建产物，后台在线更新优先使用，**免服务器构建**（小内存机器推荐）
          - xiviblog-selfhosted-v$VER.zip：纯源码包（更新时需在服务器上 npm run build）
          - Source code：GitHub 自动生成" \
                 "$RUNNER_TEMP/xiviblog-selfhosted-v$VER.zip" \
                 "$RUNNER_TEMP/xiviblog-prebuilt-v$VER.zip"

      - name: Verify release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release view "v${{ steps.ver.outputs.version }}" --repo yangxivi/XiviBlog --json assets --jq '.assets[] | .name + "  " + (.size|tostring) + " bytes  " + .state'
