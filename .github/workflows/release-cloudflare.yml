name: Release Cloudflare

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'lib/**'
      - 'migrations/**'
      - 'scripts/**'
      - 'selfhosted/scripts/build-packages.mjs'
      - '.github/workflows/release-cloudflare.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Read version
        id: ver
        run: echo "version=$(grep -oP 'APP_VERSION = \"\K[0-9.]+' lib/version.ts)" >> "$GITHUB_OUTPUT"

      - name: Package Cloudflare zip
        run: |
          node selfhosted/scripts/build-packages.mjs
          ls -lh selfhosted/dist/

      - name: Verify seed included
        env:
          VER: ${{ steps.ver.outputs.version }}
        run: |
          ZIP="selfhosted/dist/xiviblog-cloudflare-v$VER.zip"
          test -f "$ZIP" || (echo "x missing" && exit 1)
          unzip -l "$ZIP" | grep -E "_seed_full.json|import-seed.mjs" || (echo "x no seed" && exit 1)
          echo "ok seed included"

      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
          VER: ${{ steps.ver.outputs.version }}
        run: |
          TAG="v$VER"
          ZIP="selfhosted/dist/xiviblog-cloudflare-v$VER.zip"
          if gh release view "$TAG" --repo yangxivi/XiviBlog > /dev/null 2>&1; then
            gh release upload "$TAG" --repo yangxivi/XiviBlog --clobber "$ZIP"
          else
            gh release create "$TAG" --repo yangxivi/XiviBlog --latest --title "v$VER" --notes "Cloudflare Workers 版安装包（含完整演示数据种子）。" "$ZIP"
          fi
