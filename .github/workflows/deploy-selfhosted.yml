name: Deploy Selfhosted

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-selfhosted.yml'
      - 'selfhosted/**'
  workflow_dispatch:

concurrency:
  group: deploy-selfhosted-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create selfhosted package
        run: |
          cd selfhosted
          zip -r ../XiviBlog-selfhosted.zip . -x "node_modules/*" -x ".next/*" -x ".git/*"
          cd ..
          echo "Package size: $(du -h XiviBlog-selfhosted.zip | cut -f1)"

      - name: Upload to Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ github.run_number }}
          files: XiviBlog-selfhosted.zip
          fail_on_unmatched_files: true
